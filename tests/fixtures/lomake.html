<!doctype html>
<html lang="fi">
<head><meta charset="utf-8"><title>Testilomake – opiskelusuunnitelma</title></head>
<body>
<main>
  <form>
    <h2>Suoritettavat opinnot</h2>
    <div class="repeater">
      <table>
        <thead>
          <tr><th>Osaamistavoite / tutkinnon osa</th><th>Laajuus (osp)</th><th>Suoritustapa / osaaminen hankitaan</th><th>Suoritusajankohta</th><th></th></tr>
        </thead>
        <tbody id="rows">
          <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td></td></tr>
        </tbody>
      </table>
      <button type="button" id="f-prepeater9700__add">+</button>
    </div>

    <h2>Pvm &amp; päivittäjä</h2>
    <div class="repeater">
      <table>
        <thead><tr><th>Päivitetty</th><th>Päivittäjä</th><th></th></tr></thead>
        <tbody id="meta-rows">
          <tr><td><input type="text" class="date"></td><td><input type="text"></td><td></td></tr>
        </tbody>
      </table>
      <button type="button" id="f-prepeater9800__add">+</button>
    </div>
  </form>
</main>
<script>
  function addRow(tbodyId, cols) {
    setTimeout(() => {
      const tr = document.createElement('tr');
      for (let i = 0; i < cols; i++) {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'text';
        td.appendChild(input);
        tr.appendChild(td);
      }
      const last = document.createElement('td');
      const rm = document.createElement('button'); rm.type = 'button'; rm.textContent = '−';
      rm.className = 'remove'; rm.addEventListener('click', () => tr.remove());
      last.appendChild(rm); tr.appendChild(last);
      document.getElementById(tbodyId).appendChild(tr);
    }, 50);
  }
  document.getElementById('f-prepeater9700__add').addEventListener('click', () => addRow('rows', 4));
  document.getElementById('f-prepeater9800__add').addEventListener('click', () => addRow('meta-rows', 2));
</script>
</body>
</html>
