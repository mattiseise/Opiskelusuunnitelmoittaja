[project]
name = "opiskelusuunnitelmoittaja"
version = "2.4.0"
description = "Täyttää opiskelusuunnitelmalomakkeen Excel-taulukosta Playwrightilla (Chrome CDP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matti Seise" }]
dependencies = [
    "playwright>=1.47",
    "openpyxl>=3.1",
]

[project.scripts]
opiskelusuunnitelmoittaja = "opiskelusuunnitelmoittaja.cli:main"
suunnitelmoittaja-gui = "opiskelusuunnitelmoittaja.gui.app:main"
suunnitelmoittaja = "opiskelusuunnitelmoittaja.cli:main"

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pyinstaller>=6.22.3",
    "pytest-qt>=4.5.0",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opiskelusuunnitelmoittaja"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
per-file-ignores = { "src/opiskelusuunnitelmoittaja/gui/theme.py" = ["E501"] }
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ääkköset suomenkielisissä merkkijonoissa ovat tarkoituksellisia

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --browser chromium"
